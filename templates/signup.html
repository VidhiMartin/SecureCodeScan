<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Page-specific styles (MFA modal, error messages) -->
    <style>

            display: none;

<body class="auth-body">

<!-- MFA Setup Modal -->
<div id="mfa-setup-modal">
    <div class="mfa-card">
        <div class="auth-icon" style="color:#00ff88; margin-bottom: 20px;">
            <i class="fas fa-shield-alt fa-3x"></i>
        </div>
        <h2 style="color:#fff; margin-bottom: 10px;">Enable 2FA</h2>
        <p style="color:#888; font-size:0.9rem;">Scan this QR with Google Authenticator or Authy to secure your operative identity.</p>
        <img id="qr-code-display" src="" alt="MFA QR Code">
        <div id="mfa-error"></div>
        <input type="text" id="mfa-verification-code" class="mfa-input-field"
               placeholder="000000" maxlength="6" inputmode="numeric"
               pattern="\d{6}" autocomplete="one-time-code">
        <button class="btn-primary" id="mfa-verify-btn" type="button" onclick="verifyMFASetup()">
            <i class="fas fa-check-circle"></i> Verify &amp; Complete Setup
        </button>
    </div>
</div>

<!-- Signup Form -->
<div class="auth-container" id="signup-form-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
            <h1 class="logo">Secure Code Scanner</h1>
            <p class="subtitle">Create a new secure operative identity</p>
        </div>

        <div id="error-msg"></div>

        <div id="signupForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" required placeholder="Email Address" autocomplete="email">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" required placeholder="Create Password" autocomplete="new-password">
            </div>
            <div class="input-group">
                <i class="fas fa-check-double"></i>
                <input type="password" id="confirm-password" required placeholder="Confirm Password" autocomplete="new-password">
            </div>
            <button class="btn-primary" type="button" id="submitBtn" onclick="handleSignup()">
                <i class="fas fa-user-shield"></i> Initialize Account
            </button>
        </div>

        <div class="auth-footer">
            <p>Existing operative? <a href="/login">Access Vault</a></p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDpNB-BTuNjzGPsg1GfR3AuP6bqzlZftwI",
        authDomain: "codescan-b61a0.firebaseapp.com",
        projectId: "codescan-b61a0"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.tenantId = "Ent-Test-avvoo-9vpee";

    let _globalEmail = "";

    function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.style.display = "block";
    }
    function showMfaError(msg) {
        const el = document.getElementById("mfa-error");
        el.textContent = msg;
        el.style.display = "block";
    }

    function friendlyError(code) {
        const map = {
            "auth/email-already-in-use": "An account with this email already exists.",
            "auth/invalid-email": "Invalid email address.",
            "auth/weak-password": "Password must be at least 6 characters.",
            "auth/network-request-failed": "Network error. Check your connection.",
        };
        return map[code] || "Registration failed. Please try again.";
    }

    async function handleSignup() {
        document.getElementById("error-msg").style.display = "none";
        const btn = document.getElementById("submitBtn");
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPass = document.getElementById("confirm-password").value;

        if (!email || !password || !confirmPass) {
            showError("Please fill in all fields.");
            return;
        }

        if (password !== confirmPass) {
            showError("Passwords do not match.");
            return;
        }

        if (password.length < 8) {
            showError("Password must be at least 8 characters.");
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Initializing...';
        btn.disabled = true;

        try {
            // 1. Create Firebase account
            await auth.createUserWithEmailAndPassword(email, password);
            _globalEmail = email;

            // 2. Trigger MFA setup on backend
            const mfaRes = await fetch('/mfa/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (!mfaRes.ok) {
                throw new Error("MFA provisioning service unavailable.");
            }

            const mfaData = await mfaRes.json();
            if (!mfaData.qr_code) {
                throw new Error("QR code generation failed.");
            }

            // 3. Display QR modal
            document.getElementById('qr-code-display').src = `data:image/png;base64,${mfaData.qr_code}`;
            document.getElementById('signup-form-container').style.display = 'none';
            document.getElementById('mfa-setup-modal').style.display = 'flex';
            document.getElementById('mfa-verification-code').focus();

        } catch (err) {
            // If Firebase account was created but MFA setup failed, delete the account
            const user = auth.currentUser;
            if (user) {
                try { await user.delete(); } catch (_) {}
            }
            showError(err.code ? friendlyError(err.code) : err.message);
            btn.innerHTML = '<i class="fas fa-user-shield"></i> Initialize Account';
            btn.disabled = false;
        }
    }

    async function verifyMFASetup() {
        document.getElementById("mfa-error").style.display = "none";
        const code = document.getElementById('mfa-verification-code').value.trim();
        const btn = document.getElementById('mfa-verify-btn');

        if (!/^\d{6}$/.test(code)) {
            showMfaError("Please enter a valid 6-digit code.");
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
        btn.disabled = true;

        try {
            const res = await fetch('/mfa/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: _globalEmail, code: code })
            });

            const result = await res.json();

            if (result.success) {
                // Get a fresh token and store it
                const user = auth.currentUser;
                const token = await user.getIdToken(true);
                localStorage.setItem("token", token);
                window.location.href = "/scanner";
            } else {
                showMfaError(result.message || "Invalid code. Please try again.");
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Complete Setup';
                btn.disabled = false;
            }
        } catch (err) {
            showMfaError("Server error during verification. Please try again.");
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Complete Setup';
            btn.disabled = false;
        }
    }

    // Enter key support on MFA input
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('mfa-verification-code').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyMFASetup();
        });
    });
</script>
</body>
