<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | Secure Code Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-glow: #0ea5e9;
            --accent-glow: #38bdf8;
            --bg-dark: #020617;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1117 0%, #010409 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .auth-card {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 139, 253, 0.3);
            padding: 3rem 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }
        .auth-icon {
            font-size: 3rem;
            color: #10b981;
            margin-bottom: 1rem;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin: 0 0 1rem 0;
            color: #f0f6fc;
        }
        .subtitle {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1 class="logo">Password Reset Successful</h1>
    <p class="subtitle">Your new password has been set. Please log in with your new credentials.</p>
    <a href="/login" class="btn-primary">
        <i class="fas fa-sign-in-alt"></i> Go to Login
    </a>
</div>
</body>
</html>
