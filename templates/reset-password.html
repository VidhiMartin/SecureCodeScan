<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Secure Code Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Re-use the same auth styles as your login/signup pages */
        :root {
            --primary-glow: #0ea5e9;
            --accent-glow: #38bdf8;
            --bg-dark: #020617;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1117 0%, #010409 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 139, 253, 0.3);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-icon { font-size: 3rem; color: #58a6ff; margin-bottom: 1rem; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin: 0 0 0.5rem 0; }
        .subtitle { color: #8b949e; font-size: 1rem; }
        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #2ea043; }
        #error-msg {
            display: none;
            background: rgba(244,63,94,0.1);
            border: 1px solid #f43f5e;
            color: #f43f5e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-lock-open"></i></div>
        <h1 class="logo">New Password</h1>
        <p class="subtitle">Enter your new password below</p>
    </div>
    <div id="error-msg"></div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="new-password" placeholder="New password" autocomplete="new-password" />
    </div>
    <button class="btn-primary" id="reset-btn" onclick="resetPassword()">
        <i class="fas fa-check"></i> Set Password &amp; Login
    </button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDpNB-BTuNjzGPsg1GfR3AuP6bqzlZftwI",
        authDomain: "codescan-b61a0.firebaseapp.com",
        projectId: "codescan-b61a0"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.tenantId = "Ent-Test-avvoo-9vpee";  // Match your tenant

    // Get the oobCode from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.style.display = "block";
    }

    async function resetPassword() {
        const newPassword = document.getElementById("new-password").value;
        if (!newPassword || newPassword.length < 8) {
            showError("Password must be at least 8 characters.");
            return;
        }
        if (!oobCode) {
            showError("Missing reset code. Please use the link from your email.");
            return;
        }
        const btn = document.getElementById("reset-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
        try {
            // Confirm the password reset with the code
            await auth.confirmPasswordReset(oobCode, newPassword);
            // Optionally sign in immediately? No – just redirect to login.
            // The browser will prompt to save the new password under THIS domain.
            alert("Password has been reset. You can now log in with your new password.");
            window.location.href = "/login";
        } catch (err) {
            console.error("Password reset error:", err);
            let message = "Something went wrong. Please try again.";
            if (err.code === "auth/expired-action-code") message = "Reset link expired. Please request a new one.";
            else if (err.code === "auth/invalid-action-code") message = "Invalid or already used reset link.";
            showError(message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Set Password & Login';
        }
    }
</script>
</body>
</html>
