<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Secure Code Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Same auth card styling you like */
        :root {
            --primary-glow: #0ea5e9;
            --accent-glow: #38bdf8;
            --bg-dark: #020617;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1117 0%, #010409 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .auth-card {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 139, 253, 0.3);
            padding: 3rem 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }
        .auth-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin: 0 0 1rem 0;
            color: #f0f6fc;
        }
        .subtitle {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
            box-sizing: border-box;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        #error-msg {
            display: none;
            background: rgba(244,63,94,0.1);
            border: 1px solid #f43f5e;
            color: #f43f5e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        /* Confirmation state */
        .confirmation-icon {
            color: #10b981;
        }
    </style>
</head>
<body>

<!-- Step 1: Reset Form (hidden after success) -->
<div id="reset-step" class="auth-card">
    <div class="auth-icon" style="color:#58a6ff;">
        <i class="fas fa-lock-open"></i>
    </div>
    <h1 class="logo">New Password</h1>
    <p class="subtitle">Enter your new password below</p>
    <div id="error-msg"></div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="new-password" placeholder="New password" autocomplete="new-password" />
    </div>
    <button class="btn-primary" id="reset-btn" onclick="resetPassword()">
        <i class="fas fa-check"></i> Set Password & Login
    </button>
</div>

<!-- Step 2: Confirmation (hidden initially) -->
<div id="confirmation-step" class="auth-card" style="display: none;">
    <div class="auth-icon confirmation-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1 class="logo">Password Reset Successful</h1>
    <p class="subtitle">Your new password has been set. Please log in with your new credentials.</p>
    <a href="/login" class="btn-primary">
        <i class="fas fa-sign-in-alt"></i> Go to Login
    </a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDpNB-BTuNjzGPsg1GfR3AuP6bqzlZftwI",
        authDomain: "codescan-b61a0.firebaseapp.com",
        projectId: "codescan-b61a0"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.tenantId = "Ent-Test-avvoo-9vpee";

    // Get the oobCode from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    // If no oobCode, just show the reset form (will show error on submit)
    // but the user should only reach here via the email link, so it's fine.

    function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.style.display = "block";
    }

    async function resetPassword() {
        const newPassword = document.getElementById("new-password").value;
        if (!newPassword || newPassword.length < 8) {
            showError("Password must be at least 8 characters.");
            return;
        }
        if (!oobCode) {
            showError("Missing reset code. Please use the link from your email.");
            return;
        }
        const btn = document.getElementById("reset-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
        try {
            // Confirm the password reset on YOUR DOMAIN
            await auth.confirmPasswordReset(oobCode, newPassword);
            // Hide the reset form, show the confirmation
            document.getElementById("reset-step").style.display = "none";
            document.getElementById("confirmation-step").style.display = "block";
            // The browser will now prompt to save the password under secure-code-scan.vercel.app
        } catch (err) {
            console.error("Reset error:", err);
            let message = "Something went wrong. Please try again.";
            if (err.code === "auth/expired-action-code") message = "Reset link expired. Please request a new one.";
            else if (err.code === "auth/invalid-action-code") message = "Invalid or already used reset link.";
            showError(message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Set Password & Login';
        }
    }
</script>
</body>
</html>
